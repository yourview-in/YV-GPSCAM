name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Fix Kotlin Backticks, Old Packages & Room Imports
        run: |
          python3 - << 'EOF'
          import os, re, glob

          NEW_PKG_RAW = "in.yourview.yvgpscam"
          NEW_PKG_KT = "`in`.yourview.yvgpscam"

          all_kt = glob.glob("app/src/**/*.kt", recursive=True)
          all_java = glob.glob("app/src/**/*.java", recursive=True)

          THIRD_PARTY_PREFIXES = (
              NEW_PKG_RAW, "android", "androidx", "com.google", "com.android", "com.squareup",
              "okhttp3", "okio", "retrofit2", "kotlin", "kotlinx", "java", "javax",
              "org", "io", "dagger", "hilt", "net", "coil", "bumptech", "glide"
          )

          old_pkgs = set()
          for path in all_kt + all_java:
              txt = open(path, encoding="utf-8", errors="ignore").read()
              m_pkg = re.search(r'^\s*package\s+([`a-zA-Z0-9_.]+)', txt, re.M)
              if m_pkg:
                  ref = m_pkg.group(1).replace("`", "")
                  if not ref.startswith(THIRD_PARTY_PREFIXES):
                      old_pkgs.add(".".join(ref.split(".")[:3]))

          for old in old_pkgs:
              for root, _, files in os.walk("app"):
                  for f in files:
                      if f.endswith((".kt", ".java", ".xml", ".gradle", ".kts", ".pro")):
                          fp = os.path.join(root, f)
                          content = open(fp, encoding="utf-8", errors="ignore").read()
                          if old in content:
                              open(fp, "w", encoding="utf-8").write(content.replace(old, NEW_PKG_RAW))

          for path in all_kt:
              txt = open(path, encoding="utf-8", errors="ignore").read()
              fixed = re.sub(r'(^\s*(?:package|import)\s+)in\.yourview\.yvgpscam', r'\1`in`.yourview.yvgpscam', txt, flags=re.M)
              if fixed != txt:
                  open(path, "w", encoding="utf-8").write(fixed)

          class_to_pkg = {}
          for path in all_kt:
              txt = open(path, encoding="utf-8", errors="ignore").read()
              m_pkg = re.search(r'^\s*package\s+([`a-zA-Z0-9_.]+)', txt, re.M)
              pkg = m_pkg.group(1) if m_pkg else NEW_PKG_KT
              for m_cls in re.finditer(r'\b(?:class|interface|object|enum\s+class|annotation\s+class|data\s+class|sealed\s+class)\s+([A-Za-z0-9_]+)', txt):
                  class_to_pkg[m_cls.group(1)] = pkg

          for path in all_kt:
              txt = open(path, encoding="utf-8", errors="ignore").read()
              lines = txt.splitlines()
              changed = False
              m_pkg = re.search(r'^\s*package\s+([`a-zA-Z0-9_.]+)', txt, re.M)
              cur_pkg = m_pkg.group(1) if m_pkg else NEW_PKG_KT

              for i, line in enumerate(lines):
                  m_imp = re.match(r'^(\s*import\s+)([`a-zA-Z0-9_.]+)\.([A-Z][A-Za-z0-9_]*)(.*)$', line)
                  if m_imp:
                      prefix, imp_pkg, cls_name, suffix = m_imp.groups()
                      if imp_pkg.replace("`", "").startswith(NEW_PKG_RAW) and cls_name in class_to_pkg:
                          real_pkg = class_to_pkg[cls_name]
                          if real_pkg != imp_pkg:
                              lines[i] = f"{prefix}{real_pkg}.{cls_name}{suffix}"
                              changed = True

              if path.endswith("AppDatabase.kt"):
                  for target in ["CapturedPhotoEntity", "OfflineRegionEntity", "CapturedPhotoDao", "OfflineRegionDao"]:
                      if target in class_to_pkg:
                          real_pkg = class_to_pkg[target]
                          imp_stmt = f"import {real_pkg}.{target}"
                          if real_pkg != cur_pkg and imp_stmt not in "\n".join(lines):
                              for idx, l in enumerate(lines):
                                  if l.startswith("package "):
                                      lines.insert(idx + 1, imp_stmt)
                                      changed = True
                                      break

              if changed:
                  open(path, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          EOF

      - name: Setup debug.keystore & Print SHA-1
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > debug.keystore 2>/dev/null || true
          fi
          if [ -s debug.keystore ] && keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            echo "Loaded permanent debug.keystore from GitHub Secrets."
          else
            rm -f debug.keystore
            keytool -genkeypair -noprompt -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "COPY THIS SINGLE LINE INTO KEYSTORE_BASE64 SECRET:"
            base64 -w 0 debug.keystore
            echo ""
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Inject API keys & Switch Static Map to Free OSM Tiles
        env:
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          CLIENT_ID="${WEB_CLIENT_ID:-://googleusercontent.com}"
          PROJECT_NUM=$(echo "$CLIENT_ID" | cut -d'-' -f1)
          DRIVE_KEY="${GOOGLE_DRIVE_API_KEY:-placeholder}"
          GEMINI_KEY="${GEMINI_API_KEY:-placeholder}"
          MAPS_KEY="${MAPS_API_KEY:-placeholder}"

          printf "GOOGLE_DRIVE_API_KEY=%s\nGEMINI_API_KEY=%s\nMAPS_API_KEY=%s\nGOOGLE_MAPS_API_KEY=%s\n" "$DRIVE_KEY" "$GEMINI_KEY" "$MAPS_KEY" "$MAPS_KEY" >> local.properties
          printf "GOOGLE_DRIVE_API_KEY=%s\nGEMINI_API_KEY=%s\nMAPS_API_KEY=%s\nGOOGLE_MAPS_API_KEY=%s\n" "$DRIVE_KEY" "$GEMINI_KEY" "$MAPS_KEY" "$MAPS_KEY" > secrets.properties
          printf "\nGOOGLE_DRIVE_API_KEY=%s\nGEMINI_API_KEY=%s\nMAPS_API_KEY=%s\nGOOGLE_MAPS_API_KEY=%s\n" "$DRIVE_KEY" "$GEMINI_KEY" "$MAPS_KEY" "$MAPS_KEY" >> gradle.properties

          cat << 'PYEOF' > patch_map_and_keys.py
          import os, re, glob

          maps_key = os.environ.get("MAPS_API_KEY", "placeholder") or "placeholder"
          drive_key = os.environ.get("GOOGLE_DRIVE_API_KEY", "placeholder") or "placeholder"
          gemini_key = os.environ.get("GEMINI_API_KEY", "placeholder") or "placeholder"
          client_id = os.environ.get("WEB_CLIENT_ID", "://googleusercontent.com") or "://googleusercontent.com"

          # 1. Inject real API keys into build.gradle.kts / build.gradle
          for gradle_file in ["app/build.gradle.kts", "app/build.gradle"]:
              if os.path.exists(gradle_file):
                  g_txt = open(gradle_file, encoding="utf-8").read()
                  if maps_key != "placeholder":
                      g_txt = g_txt.replace("MY_MAPS_API_KEY", maps_key)
                      g_txt = re.sub(r'(buildConfigField\s*\(\s*"String"\s*,\s*"(?:MAPS_API_KEY|GOOGLE_MAPS_API_KEY)"\s*,\s*)[^)]+(\))', rf'\g<1>"\"{maps_key}\""\g<2>', g_txt)
                      g_txt = re.sub(r'(manifestPlaceholders\["(?:MAPS_API_KEY|GOOGLE_MAPS_API_KEY)"\]\s*=\s*)[^
]+', rf'\g<1>"{maps_key}"', g_txt)
                  if drive_key != "placeholder":
                      g_txt = g_txt.replace("MY_DRIVE_API_KEY", drive_key).replace("MY_GOOGLE_DRIVE_API_KEY", drive_key)
                      g_txt = re.sub(r'(buildConfigField\s*\(\s*"String"\s*,\s*"(?:GOOGLE_DRIVE_API_KEY|DRIVE_API_KEY)"\s*,\s*)[^)]+(\))', rf'\g<1>"\"{drive_key}\""\g<2>', g_txt)
                  if gemini_key != "placeholder":
                      g_txt = g_txt.replace("MY_GEMINI_API_KEY", gemini_key)
                      g_txt = re.sub(r'(buildConfigField\s*\(\s*"String"\s*,\s*"GEMINI_API_KEY"\s*,\s*)[^)]+(\))', rf'\g<1>"\"{gemini_key}\""\g<2>', g_txt)
                  if "googleusercontent.com" in client_id and not client_id.startswith("://"):
                      g_txt = g_txt.replace("MY_WEB_CLIENT_ID", client_id)
                      g_txt = re.sub(r'(buildConfigField\s*\(\s*"String"\s*,\s*"WEB_CLIENT_ID"\s*,\s*)[^)]+(\))', rf'\g<1>"\"{client_id}\""\g<2>', g_txt)
                  open(gradle_file, "w", encoding="utf-8").write(g_txt)

          # 2. Bypass isApiKeyConfigured() in GoogleMapsComponents.kt
          for fp in glob.glob("app/src/main/**/*.kt", recursive=True):
              k_txt = open(fp, encoding="utf-8", errors="ignore").read()
              orig_k = k_txt
              k_txt = re.sub(
                  r'(fun\s+isApiKeyConfigured\s*\([^)]*\)\s*:\s*Boolean\s*\{)',
                  r'
        return true',
                  k_txt
              )
              k_txt = re.sub(
                  r'(fun\s+isApiKeyConfigured\s*\([^)]*\)\s*:\s*Boolean\s*=)[^
]+',
                  r' true',
                  k_txt
              )
              if k_txt != orig_k:
                  open(fp, "w", encoding="utf-8").write(k_txt)

          # 3. Replace fetchGoogleStaticMapAndCache in OfflineMapRepository.kt to use built-in free tile fetcher
          repo_path = "app/src/main/java/in/yourview/yvgpscam/map/OfflineMapRepository.kt"
          if os.path.exists(repo_path):
              r_txt = open(repo_path, encoding="utf-8").read()
              old_fn_pattern = re.compile(
                  r'fun\s+fetchGoogleStaticMapAndCache\s*\([^)]*\)\s*:\s*ByteArray\?\s*\{.*?(?=
\s*fun\s+fetchHybridOverlayTile)',
                  re.DOTALL
              )
              new_fn = '''fun fetchGoogleStaticMapAndCache(
                  lat: Double,
                  lon: Double,
                  zoom: Int,
                  outputSizePx: Int,
                  mapStyle: MapStyle
              ): ByteArray? {
                  val z = zoom.coerceIn(1, 18)
                  val n = 2.0.pow(z.toDouble())
                  val x = floor((lon + 180.0) / 360.0 * n).toInt().coerceIn(0, n.toInt() - 1)
                  val latRad = Math.toRadians(lat.coerceIn(-85.0511, 85.0511))
                  val y = floor((1.0 - ln(tan(latRad) + 1.0 / cos(latRad)) / PI) / 2.0 * n).toInt().coerceIn(0, n.toInt() - 1)
                  if (hasCachedTile(z, x, y, mapStyle)) {
                      return runCatching { getTileFile(z, x, y, mapStyle).readBytes() }.getOrNull()
                  }
                  return fetchTileFromNetworkAndCache(z, x, y, mapStyle)
              }

          '''
              if old_fn_pattern.search(r_txt):
                  r_txt = old_fn_pattern.sub(new_fn, r_txt, count=1)
                  open(repo_path, "w", encoding="utf-8").write(r_txt)
                  print("Patched fetchGoogleStaticMapAndCache to use free Carto/ArcGIS/OSM tiles!")

          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path) and maps_key != "placeholder":
              m_txt = open(manifest_path, encoding="utf-8").read()
              m_txt = m_txt.replace("MY_MAPS_API_KEY", maps_key)
              open(manifest_path, "w", encoding="utf-8").write(m_txt)
          PYEOF
          python3 patch_map_and_keys.py
          rm -f patch_map_and_keys.py

          cat << EOF > app/google-services.json
          {
            "project_info": { "project_number": "$PROJECT_NUM", "project_id": "yvgpscam-$PROJECT_NUM" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:$PROJECT_NUM:android:0000000000000000", "android_client_info": { "package_name": "in.yourview.yvgpscam" } },
              "oauth_client": [{ "client_id": "$CLIENT_ID", "client_type": 3 }],
              "api_key": [{ "current_key": "$DRIVE_KEY" }]
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Inject In-App Auto-Update Popup
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re, glob
          repo = os.environ["REPO"]
          m_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(m_path):
              txt = open(m_path).read()
              if "android.permission.INTERNET" not in txt:
                  open(m_path, "w").write(txt.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />
    <application', 1))
          files = glob.glob("app/src/main/**/MainActivity.kt", recursive=True) + glob.glob("app/src/main/**/MainActivity.java", recursive=True)
          if not files: exit(0)
          tf = files.pop(0)
          src = open(tf).read()
          pm = re.search(r'^\s*(package\s+[^
;]+)', src, re.M)
          pkg_line = pm.group(1).strip() if pm else "package `in`.yourview.yvgpscam"
          code = f'''{pkg_line}
          import android.app.AlertDialog
          import android.content.*
          import android.net.Uri
          import android.os.*
          import org.json.JSONObject
          import java.net.*
          import kotlin.concurrent.thread
          object AutoAppUpdater {{
              private const val URL_STR = "https://github.com/{repo}/releases/latest/download/update-manifest.json"
              private var done = false
              @JvmStatic fun checkForUpdate(ctx: Context) {{
                  if (done) return; done = true
                  thread {{
                      try {{
                          val c = (URL(URL_STR).openConnection() as HttpURLConnection).apply {{ connectTimeout = 5000; readTimeout = 5000 }}
                          val j = JSONObject(c.inputStream.bufferedReader().readText())
                          val lc = j.getInt("versionCode"); val ln = j.getString("versionName")
                          val notes = j.optString("notes", "New update available."); val apk = j.getString("apkUrl")
                          val pi = ctx.packageManager.getPackageInfo(ctx.packageName, 0)
                          val cc = if (Build.VERSION.SDK_INT >= 28) pi.longVersionCode.toInt() else @Suppress("DEPRECATION") pi.versionCode
                          if (lc > cc) Handler(Looper.getMainLooper()).post {{
                              try {{
                                  AlertDialog.Builder(ctx).setTitle("Update Available (v$ln)")
                                      .setMessage("What's New:\n$notes\n\nTap Update Now to install.")
                                      .setPositiveButton("Update Now") {{ _, _ -> ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(apk))) }}
                                      .setNegativeButton("Later", null).show()
                              }} catch (_: Exception) {{}}
                          }}
                      }} catch (_: Exception) {{}}
                  }}
              }}
          }}'''
          open(os.path.join(os.path.dirname(tf), "AutoAppUpdater.kt"), "w").write("
".join(l[10:] if l.startswith("          ") else l for l in code.splitlines()))
          if "AutoAppUpdater.checkForUpdate" not in src:
              rep = r'
        AutoAppUpdater.checkForUpdate(this)' if tf.endswith(".kt") else r'
        AutoAppUpdater.checkForUpdate(this);'
              s2, n = re.subn(r'(super\.onCreate\([^\)]*\);?)', rep, src, count=1)
              if n > 0: open(tf, "w").write(s2); print("Injected AutoAppUpdater into", tf)
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: true

      - name: Build Debug APK
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          cat << 'EOF' > ci-version.init.gradle
          allprojects {
              plugins.withId("com.android.application") {
                  android { defaultConfig {
                      versionCode = project.property("APP_VERSION_CODE").toString().toInteger()
                      versionName = project.property("APP_VERSION_NAME").toString()
                  } }
              }
          }
          EOF
          gradle clean assembleDebug --no-build-cache --no-configuration-cache --init-script ci-version.init.gradle -PAPP_VERSION_CODE=${BUILD_NUM} -PAPP_VERSION_NAME=${VERSION_NAME} -Djava.awt.headless=true

      - name: Rename APK & Generate Update Manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          BUILD_NUM=${{ github.run_number }}
          VER_NAME="1.0.${BUILD_NUM}"
          APK_NAME="YVGPSCAM-v${VER_NAME}.apk"
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          mkdir -p release-apk
          cp "$APK_FILE" "release-apk/${APK_NAME}"
          RELEASE_NOTES=$(git log -1 --pretty=%s || echo "Automated APK build")
          VER_CODE="$BUILD_NUM" VER_NAME="$VER_NAME" APK_FILE="$APK_NAME" REPO="$REPO" RELEASE_NOTES="$RELEASE_NOTES" python3 -c '
          import json, os
          m = {"versionCode": int(os.environ["VER_CODE"]), "versionName": os.environ["VER_NAME"], "tag": "v" + os.environ["VER_NAME"], "title": "YVGPSCAM v" + os.environ["VER_NAME"], "notes": os.environ["RELEASE_NOTES"], "apkUrl": "https://github.com/" + os.environ["REPO"] + "/releases/download/v" + os.environ["VER_NAME"] + "/" + os.environ["APK_FILE"], "releaseUrl": "https://github.com/" + os.environ["REPO"] + "/releases/tag/v" + os.environ["VER_NAME"]}
          open("release-apk/update-manifest.json", "w").write(json.dumps(m, indent=2))
          '

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YVGPSCAM-v${{ env.VERSION_NAME }}
          path: release-apk/*.apk

      - name: Publish Direct APK & Manifest to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: YVGPSCAM v${{ env.VERSION_NAME }}
          body: "Automated APK build from Google AI Studio push (Commit: ${{ github.sha }})."
          files: |
            release-apk/YVGPSCAM-v${{ env.VERSION_NAME }}.apk
            release-apk/update-manifest.json
