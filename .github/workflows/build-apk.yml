name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Fix Old Package Names & Inspect AppDatabase
        run: |
          python3 - << 'EOF'
          import os, re, glob

          NEW_PKG = "in.yourview.yvgpscam"
          old_pkgs = set()

          for path in glob.glob("app/src/**/*.*", recursive=True):
              if path.endswith((".kt", ".java")):
                  txt = open(path, encoding="utf-8", errors="ignore").read()
                  m = re.search(r'^\s*package\s+([a-zA-Z0-9_.]+)', txt, re.M)
                  if m:
                      pkg = m.group(1)
                      if not pkg.startswith(NEW_PKG) and not pkg.startswith(("android", "androidx", "com.google", "kotlin", "java")):
                          base = ".".join(pkg.split(".")[:3])
                          old_pkgs.add(base)

          for old in old_pkgs:
              print(f"Replacing old package '{old}' -> '{NEW_PKG}'")
              for root, _, files in os.walk("app"):
                  for f in files:
                      if f.endswith((".kt", ".java", ".xml", ".gradle", ".kts", ".pro")):
                          fp = os.path.join(root, f)
                          content = open(fp, encoding="utf-8", errors="ignore").read()
                          if old in content:
                              open(fp, "w", encoding="utf-8").write(content.replace(old, NEW_PKG))

          print("=== AppDatabase.kt ===")
          for db in glob.glob("app/**/AppDatabase.kt", recursive=True):
              print(f"--- {db} ---")
              print(open(db, encoding="utf-8", errors="ignore").read())
          EOF

      - name: Setup debug.keystore & Print SHA-1
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > debug.keystore 2>/dev/null || true
          fi
          if [ -s debug.keystore ] && keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            echo "Loaded permanent debug.keystore from GitHub Secrets."
          else
            rm -f debug.keystore
            keytool -genkeypair -noprompt -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "COPY THIS SINGLE LINE INTO KEYSTORE_BASE64 SECRET:"
            base64 -w 0 debug.keystore
            echo ""
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Inject API keys & generate google-services.json
        env:
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          CLIENT_ID="${WEB_CLIENT_ID:-://googleusercontent.com}"
          PROJECT_NUM=$(echo "$CLIENT_ID" | cut -d'-' -f1)
          DRIVE_KEY="${GOOGLE_DRIVE_API_KEY:-placeholder}"
          GEMINI_KEY="${GEMINI_API_KEY:-placeholder}"
          MAPS_KEY="${MAPS_API_KEY:-placeholder}"
          printf "GOOGLE_DRIVE_API_KEY=%s\nGEMINI_API_KEY=%s\nMAPS_API_KEY=%s\n" "$DRIVE_KEY" "$GEMINI_KEY" "$MAPS_KEY" >> local.properties
          printf "GOOGLE_DRIVE_API_KEY=%s\nGEMINI_API_KEY=%s\nMAPS_API_KEY=%s\n" "$DRIVE_KEY" "$GEMINI_KEY" "$MAPS_KEY" > secrets.properties
          cat << EOF > app/google-services.json
          {
            "project_info": { "project_number": "$PROJECT_NUM", "project_id": "yvgpscam-$PROJECT_NUM" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:$PROJECT_NUM:android:0000000000000000", "android_client_info": { "package_name": "in.yourview.yvgpscam" } },
              "oauth_client": [{ "client_id": "$CLIENT_ID", "client_type": 3 }],
              "api_key": [{ "current_key": "$DRIVE_KEY" }]
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Inject In-App Auto-Update Popup
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re, glob
          repo = os.environ["REPO"]
          m_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(m_path):
              txt = open(m_path).read()
              if "android.permission.INTERNET" not in txt:
                  open(m_path, "w").write(txt.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1))
          files = glob.glob("app/src/main/**/MainActivity.kt", recursive=True) + glob.glob("app/src/main/**/MainActivity.java", recursive=True)
          if not files: exit(0)
          tf = files.pop(0)
          src = open(tf).read()
          pm = re.search(r'^\s*(package\s+[^\r\n;]+)', src, re.M)
          pkg_line = pm.group(1).strip() if pm else "package in.yourview.yvgpscam"
          code = f'''{pkg_line}
          import android.app.AlertDialog
          import android.content.*
          import android.net.Uri
          import android.os.*
          import org.json.JSONObject
          import java.net.*
          import kotlin.concurrent.thread
          object AutoAppUpdater {{
              private const val URL_STR = "https://github.com/{repo}/releases/latest/download/update-manifest.json"
              private var done = false
              @JvmStatic fun checkForUpdate(ctx: Context) {{
                  if (done) return; done = true
                  thread {{
                      try {{
                          val c = (URL(URL_STR).openConnection() as HttpURLConnection).apply {{ connectTimeout = 5000; readTimeout = 5000 }}
                          val j = JSONObject(c.inputStream.bufferedReader().readText())
                          val lc = j.getInt("versionCode"); val ln = j.getString("versionName")
                          val notes = j.optString("notes", "New update available."); val apk = j.getString("apkUrl")
                          val pi = ctx.packageManager.getPackageInfo(ctx.packageName, 0)
                          val cc = if (Build.VERSION.SDK_INT >= 28) pi.longVersionCode.toInt() else @Suppress("DEPRECATION") pi.versionCode
                          if (lc > cc) Handler(Looper.getMainLooper()).post {{
                              try {{
                                  AlertDialog.Builder(ctx).setTitle("Update Available (v$ln)")
                                      .setMessage("What's New:\\n$notes\\n\\nTap Update Now to install.")
                                      .setPositiveButton("Update Now") {{ _, _ -> ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(apk))) }}
                                      .setNegativeButton("Later", null).show()
                              }} catch (_: Exception) {{}}
                          }}
                      }} catch (_: Exception) {{}}
                  }}
              }}
          }}'''
          open(os.path.join(os.path.dirname(tf), "AutoAppUpdater.kt"), "w").write("\n".join(l[10:] if l.startswith("          ") else l for l in code.splitlines()))
          if "AutoAppUpdater.checkForUpdate" not in src:
              rep = r'\1\n        AutoAppUpdater.checkForUpdate(this)' if tf.endswith(".kt") else r'\1\n        AutoAppUpdater.checkForUpdate(this);'
              s2, n = re.subn(r'(super\.onCreate\([^\)]*\);?)', rep, src, count=1)
              if n > 0: open(tf, "w").write(s2); print("Injected AutoAppUpdater into", tf)
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: true

      - name: Build Debug APK
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          cat << 'EOF' > ci-version.init.gradle
          allprojects {
              plugins.withId("com.android.application") {
                  android { defaultConfig {
                      versionCode = project.property("APP_VERSION_CODE").toString().toInteger()
                      versionName = project.property("APP_VERSION_NAME").toString()
                  } }
              }
          }
          EOF
          gradle clean assembleDebug --no-build-cache --stacktrace --init-script ci-version.init.gradle -PAPP_VERSION_CODE=${BUILD_NUM} -PAPP_VERSION_NAME=${VERSION_NAME} -Djava.awt.headless=true

      - name: Rename APK & Generate Update Manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          BUILD_NUM=${{ github.run_number }}
          VER_NAME="1.0.${BUILD_NUM}"
          APK_NAME="YVGPSCAM-v${VER_NAME}.apk"
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          mkdir -p release-apk
          cp "$APK_FILE" "release-apk/${APK_NAME}"
          RELEASE_NOTES=$(git log -1 --pretty=%s || echo "Automated APK build")
          VER_CODE="$BUILD_NUM" VER_NAME="$VER_NAME" APK_FILE="$APK_NAME" REPO="$REPO" RELEASE_NOTES="$RELEASE_NOTES" python3 -c '
          import json, os
          m = {"versionCode": int(os.environ["VER_CODE"]), "versionName": os.environ["VER_NAME"], "tag": "v" + os.environ["VER_NAME"], "title": "YVGPSCAM v" + os.environ["VER_NAME"], "notes": os.environ["RELEASE_NOTES"], "apkUrl": "https://github.com/" + os.environ["REPO"] + "/releases/download/v" + os.environ["VER_NAME"] + "/" + os.environ["APK_FILE"], "releaseUrl": "https://github.com/" + os.environ["REPO"] + "/releases/tag/v" + os.environ["VER_NAME"]}
          open("release-apk/update-manifest.json", "w").write(json.dumps(m, indent=2))
          '

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YVGPSCAM-v${{ env.VERSION_NAME }}
          path: release-apk/*.apk

      - name: Publish Direct APK & Manifest to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: YVGPSCAM v${{ env.VERSION_NAME }}
          body: "Automated APK build from Google AI Studio push (Commit: ${{ github.sha }})."
          files: |
            release-apk/YVGPSCAM-v${{ env.VERSION_NAME }}.apk
            release-apk/update-manifest.json
